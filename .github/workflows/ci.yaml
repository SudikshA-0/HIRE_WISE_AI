name: HireWise validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            mlops/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r mlops/requirements.txt
          pip install pip-audit
      - name: Python syntax check
        run: python -m compileall -q app.py config.py routes services mlops
      - name: Import Flask app with disposable storage
        env:
          DATABASE_URL: sqlite:////tmp/hirewise-ci.db
          HIREWISE_UPLOAD_FOLDER: /tmp/hirewise-ci-uploads
          FLASK_ENV: production
          FLASK_SECRET_KEY: ci-only-not-a-secret
        run: python -c "import app; print('Flask app import succeeded')"
      - name: MLOps validation, training, API, and integration tests
        run: python -m pytest -q mlops/tests
      - name: Dependency security audit
        run: pip-audit -r mlops/requirements.txt
      - name: Build container without publishing
        run: docker build --tag hirewise-mlops:ci ./mlops
